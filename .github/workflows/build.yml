# Đóng gói Edit Studio cho Windows (ZIP) và macOS chip Apple + Intel (DMG) — build song song trên máy của GitHub.
#   • Mỗi pull request / push lên main: file nằm ở mục «Artifacts» của lần chạy (giữ 7 ngày).
#   • Đẩy tag v* (vd. v1.0.1): tạo GitHub Release kèm ZIP Windows + 2 DMG macOS (arm64, x86_64).
#   • Chạy tay: tab Actions → Build → Run workflow.
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt av pyinstaller

      - name: Cài VieNeu (TTS tiếng Việt local, tuỳ chọn)
        continue-on-error: true
        run: |
          pip install "sea-g2p>=0.9.1" "onnxruntime>=1.20.0" numpy soundfile soxr "kaldi-native-fbank>=1.20" "tokenizers>=0.20" huggingface_hub PyYAML "librosa>=0.11.0"
          pip install --no-deps vieneu

      - name: Kiểm tra cú pháp
        run: python -m compileall -q app main.py

      - name: Tải FFmpeg (gyan.dev full)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ffmpeg.7z
          7z e ffmpeg.7z -obin ffmpeg.exe ffprobe.exe -r -y | Out-Null
          if (!(Test-Path bin/ffmpeg.exe) -or !(Test-Path bin/ffprobe.exe)) { throw "Không giải nén được ffmpeg" }
          bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Kiểm tra FFmpeg (phụ đề + NVENC/QSV/AMF)
        run: python tools/ci_check_ffmpeg.py bin/ffmpeg.exe h264_nvenc h264_qsv h264_amf

      - name: PyInstaller
        run: pyinstaller --noconfirm EditStudio.spec

      - name: Ghép thư mục phát hành
        shell: pwsh
        run: |
          $d = "dist/EditStudio"
          New-Item -ItemType Directory -Force "$d/bin", "$d/presets", "$d/app" | Out-Null
          Copy-Item bin/ffmpeg.exe, bin/ffprobe.exe "$d/bin/"
          Copy-Item presets/* "$d/presets/" -Recurse -Force
          Copy-Item app/assets "$d/app/" -Recurse -Force
          Copy-Item tools/DOC_ZIP.txt "$d/DOC_TRUOC.txt"

      - name: Chạy thử EditStudio.exe --selftest
        shell: pwsh
        run: |
          $d = Resolve-Path "dist/EditStudio"
          $p = Start-Process "$d/EditStudio.exe" -ArgumentList "--selftest" -WorkingDirectory $d -PassThru
          if (!$p.WaitForExit(240000)) { $p.Kill(); throw "EditStudio.exe --selftest treo quá 4 phút" }
          if (!(Test-Path "$d/logs/selftest.txt")) {
            if (Test-Path "$d/logs/edit_studio.log") { Get-Content "$d/logs/edit_studio.log" -Tail 60 }
            throw "EditStudio.exe không chạy được (không có logs/selftest.txt)"
          }
          Get-Content "$d/logs/selftest.txt"
          # selftest tạo các thư mục dữ liệu cạnh exe → xoá, không đóng vào ZIP
          foreach ($n in "logs", "output", "cache", "models", "voices", "settings.json") {
            if (Test-Path "$d/$n") { Remove-Item "$d/$n" -Recurse -Force }
          }

      - name: Nén ZIP
        shell: pwsh
        run: |
          $ver = python -c "from app.config.paths import APP_VERSION; print(APP_VERSION)"
          $name = "EditStudio-$ver-win64-Lite"
          if ("${{ github.ref_type }}" -ne "tag") { $name += "-" + "${{ github.sha }}".Substring(0, 7) }
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip -mx=5 "release/$name.zip" ./dist/EditStudio | Out-Null
          $zip = Get-Item "release/$name.zip"
          "ZIP: $($zip.Name) · {0:N0} MB" -f ($zip.Length / 1MB)
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip.Name | Out-File release/SHA256-windows.txt -Encoding utf8
          "PKG_NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            release/${{ env.PKG_NAME }}.zip
            release/SHA256-windows.txt
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS ${{ matrix.label }} (DMG)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Apple Silicon", runner: macos-14, arch: arm64, ffarch: arm64 }
          - { label: "Intel", runner: macos-15-intel, arch: x86_64, ffarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt av pyinstaller
          python -c "import tkinter, platform; print('Tk', tkinter.TkVersion, platform.machine()); assert platform.machine() == '${{ matrix.arch }}'"

      - name: Cài VieNeu (TTS tiếng Việt local, tuỳ chọn)
        continue-on-error: true
        run: |
          pip install "sea-g2p>=0.9.1" "onnxruntime>=1.20.0" numpy soundfile soxr "kaldi-native-fbank>=1.20" "tokenizers>=0.20" huggingface_hub PyYAML "librosa>=0.11.0"
          pip install --no-deps vieneu

      - name: Kiểm tra cú pháp
        run: python -m compileall -q app main.py

      - name: Tải FFmpeg (${{ matrix.ffarch }}, build tĩnh — ffmpeg.martin-riedl.de)
        run: |
          mkdir -p bin
          for t in ffmpeg ffprobe; do
            curl -fsSL --retry 3 -o "$t.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.ffarch }}/release/$t.zip"
            unzip -o -q "$t.zip" -d bin
          done
          chmod +x bin/ffmpeg bin/ffprobe
          file bin/ffmpeg
          otool -L bin/ffmpeg
          bin/ffmpeg -hide_banner -version | head -1

      - name: Kiểm tra FFmpeg (phụ đề + VideoToolbox)
        run: python tools/ci_check_ffmpeg.py bin/ffmpeg h264_videotoolbox hevc_videotoolbox

      - name: PyInstaller
        run: pyinstaller --noconfirm EditStudio.spec

      - name: Phiên bản macOS tối thiểu (đo từ thư viện trong gói)
        run: |
          APP="dist/Edit Studio.app"
          # macOS thấp nhất mà MỌI file nhị phân trong gói chạy được = giá trị lớn nhất trong số chúng
          # «minos» của LC_BUILD_VERSION; «version» CHỈ khi nằm trong LC_VERSION_MIN_MACOSX (dòng «version» khác là
          # phiên bản trình liên kết ld — vd. 1167.5 — không phải macOS)
          MIN=$(find "$APP" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \) -print0 \
                | xargs -0 -n1 vtool -show-build 2>/dev/null \
                | awk '$1 == "cmd" {cmd = $2}
                       $1 == "minos" {print $2}
                       $1 == "version" && cmd == "LC_VERSION_MIN_MACOSX" {print $2}' | sort -V | tail -1)
          [ -n "$MIN" ] || MIN=12.0
          echo "macOS tối thiểu: $MIN"
          MAJOR=${MIN%%.*}
          if [ "$MAJOR" -lt 10 ] || [ "$MAJOR" -gt 30 ]; then
            echo "::error::Giá trị macOS tối thiểu vô lý: $MIN"; exit 1
          fi
          OS=$(sw_vers -productVersion)
          if [ "$(printf '%s\n%s\n' "$MIN" "$OS" | sort -V | tail -1)" != "$OS" ]; then
            echo "::error::macOS tối thiểu ($MIN) cao hơn macOS của máy build ($OS) — app sẽ không mở được"; exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion $MIN" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"          # sửa Info.plist → ký ad-hoc lại
          codesign --verify --deep --strict "$APP"
          echo "MACOS_MIN=$MIN" >> "$GITHUB_ENV"

      - name: Chạy thử --selftest
        run: |
          EXE="dist/Edit Studio.app/Contents/MacOS/EditStudio"
          DATA="$HOME/Library/Application Support/Edit Studio"
          "$EXE" --selftest &
          pid=$!
          ( sleep 240; kill "$pid" 2>/dev/null ) &
          wait "$pid" || true
          if [ ! -f "$DATA/logs/selftest.txt" ]; then
            tail -60 "$DATA/logs/edit_studio.log" 2>/dev/null || true
            echo "::error::Edit Studio.app không chạy được (không có logs/selftest.txt)"; exit 1
          fi
          cat "$DATA/logs/selftest.txt"

      - name: Mở giao diện thử 30 giây (mở như người dùng, qua Launch Services)
        run: |
          APP="dist/Edit Studio.app"
          LOG="$HOME/Library/Application Support/Edit Studio/logs/edit_studio.log"
          # «open» đi qua Launch Services → kiểm tra luôn Info.plist (LSMinimumSystemVersion, chữ ký) như khi bấm đúp
          open -n "$APP"
          sleep 30
          pid=$(pgrep -f "Edit Studio.app/Contents/MacOS/EditStudio" | head -1)
          if [ -z "$pid" ]; then
            tail -80 "$LOG" 2>/dev/null; echo "::error::App không mở được / tự thoát khi mở bằng open"; exit 1
          fi
          kill "$pid"
          tail -20 "$LOG"
          if grep -q "Traceback" "$LOG"; then grep -B2 -A20 "Traceback" "$LOG" | head -80; echo "::error::Có lỗi Python khi mở giao diện"; exit 1; fi
          grep -q "sẵn sàng" "$LOG" || { echo "::error::Giao diện chưa báo sẵn sàng"; exit 1; }
          rm -rf "$HOME/Library/Application Support/Edit Studio"

      - name: Tạo DMG
        run: |
          VER=$(python -c "from app.config.paths import APP_VERSION; print(APP_VERSION)")
          NAME="EditStudio-$VER-macOS-${{ matrix.arch }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then NAME="$NAME-${GITHUB_SHA::7}"; fi
          mkdir -p dmg release
          ditto "dist/Edit Studio.app" "dmg/Edit Studio.app"
          ln -s /Applications dmg/Applications
          sed -e "s/__MACOS_MIN__/$MACOS_MIN/" -e "s/__ARCH__/${{ matrix.label }}/" tools/DOC_MAC.txt > "dmg/DOC TRUOC.txt"
          hdiutil create -volname "Edit Studio" -srcfolder dmg -ov -format UDZO "release/$NAME.dmg"
          ls -lh release
          (cd release && shasum -a 256 "$NAME.dmg" > "SHA256-macos-${{ matrix.arch }}.txt")
          echo "PKG_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            release/${{ env.PKG_NAME }}.dmg
            release/SHA256-macos-${{ matrix.arch }}.txt
          compression-level: 0
          retention-days: 7

  release:
    name: GitHub Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
